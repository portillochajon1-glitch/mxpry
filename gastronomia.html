<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traditional Gastronomy - Maya Horizon Travels</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #080c14; 
            color: #f1f5f9; 
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .mayan-border {
            height: 14px;
            width: 100%;
            background-image: repeating-linear-gradient(
                90deg,
                #111827 0px, #111827 10px,
                #E63946 10px, #E63946 20px,
                #D4AF37 20px, #D4AF37 30px,
                #00A896 30px, #00A896 40px
            );
            border-bottom: 2px solid #E63946;
        }

        header {
            padding: 20px 40px;
            background: #0d1322;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #E63946;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            color: #E63946;
            font-size: 1.6rem;
        }

        .header-btns {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-spot { background: rgba(0, 168, 150, 0.2); color: #00A896; border: 1px solid #00A896; }
        .btn-spot:hover { background: #00A896; color: #fff; }
        .btn-back { background: #D4AF37; color: #0b0f19; }
        .btn-back:hover { background: #fff; }

        .content-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        .food-card {
            background: #0d1322;
            border: 2px solid #E63946;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(230,57,70,0.2);
        }

        /* 3-IMAGE GASTRONOMY GALLERY */
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
            background: #080c14;
        }

        .gallery-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #E63946;
            transition: transform 0.3s ease;
        }

        .gallery-img:hover {
            transform: scale(1.03);
        }

        .food-body {
            padding: 30px;
        }

        .title-badge {
            display: inline-block;
            background: rgba(230, 57, 70, 0.2);
            color: #E63946;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .food-title {
            font-family: 'Cinzel', serif;
            color: #D4AF37;
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .dish-highlight {
            font-size: 1.1rem;
            color: #f1f5f9;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 15px;
        }

        .grid-boxes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .box {
            background: #111827;
            border: 1px solid #1f293d;
            padding: 20px;
            border-radius: 8px;
        }

        .box-ingredients { border-left: 4px solid #D4AF37; }
        .box-drink { border-left: 4px solid #E63946; }

        .box h3 {
            font-family: 'Cinzel', serif;
            color: #D4AF37;
            margin-bottom: 10px;
        }

        .box p {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .image-gallery { grid-template-columns: 1fr; }
            .gallery-img { height: 180px; }
            .grid-boxes { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="mayan-border"></div>
