<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Globe - Mexico with Stylized Airplane</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #05020a; 
            color: #FFC800; 
            font-family: 'Poppins', sans-serif; 
            overflow: hidden; 
            height: 100vh;
        }

        .mayan-border-top {
            height: 14px;
            width: 100%;
            background-image: repeating-linear-gradient(
                90deg,
                #8C1D24 0px, #8C1D24 10px,
                #E31B23 10px, #E31B23 20px,
                #F26522 20px, #F26522 30px,
                #FFC800 30px, #FFC800 40px,
                #009B9E 40px, #009B9E 50px
            );
            border-bottom: 2px solid #FFC800;
            position: absolute;
            top: 0;
            z-index: 10;
        }

        header {
            position: absolute;
            top: 14px;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        header * { pointer-events: auto; }

        header h1 {
            font-family: 'Cinzel', serif;
            color: #FFC800;
            font-size: 1.5rem;
            text-shadow: 0 0 15px rgba(255, 200, 0, 0.5);
        }

        .btn-map {
            background: #009B9E;
            color: #120914;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid #009B9E;
            box-shadow: 0 0 15px rgba(0, 155, 158, 0.4);
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-map:hover {
            background: #FFC800;
            border-color: #FFC800;
            color: #120914;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .instruction-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 9, 20, 0.9);
            border: 1px solid #F26522;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #FFC800;
            z-index: 10;
            pointer-events: none;
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        /* Responsive Styles for Mobile */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
                text-align: center;
            }

            header h1 {
                font-size: 1.2rem;
            }

            .btn-map {
                font-size: 0.8rem;
                padding: 6px 12px;
            }

            .instruction-box {
                font-size: 0.75rem;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="mayan-border-top"></div>

    <header>
        <h1>🇲🇽 EXPLORE MEXICO 3D</h1>
        <a href="mapa.html" class="btn-map">🗺️ Open Interactive Map</a>
    </header>

    <div class="instruction-box">
        ✈️ Toy-style Airplane orbiting • 🖱️ Drag to rotate • 🇲🇽 Click pyramid/flag to view map
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // Responsive camera distance function
        function getCameraDistance() {
            return window.innerWidth < 600 ? 28 : 22;
        }

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 15, 10);
        scene.add(dirLight);

        // --- STARFIELD BACKGROUND ---
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 3000;
        const starPositions = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 500;
            starPositions[i + 1] = (Math.random() - 0.5) * 500;
            starPositions[i + 2] = (Math.random() - 0.5) * 500;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.7,
            transparent: true,
            opacity: 0.8
        });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // --- GLOBE & CLOUDS ---
        const globeRadius = 5;
        const textureLoader = new THREE.TextureLoader();
        
        const globeGeo = new THREE.SphereGeometry(globeRadius, 64, 64);
        const globeMat = new THREE.MeshStandardMaterial({
            map: textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
            bumpMap: textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png'),
            bumpScale: 0.08,
            roughness: 0.6
        });
        const globe = new THREE.Mesh(globeGeo, globeMat);
        scene.add(globe);

        const cloudGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
        const cloudMat = new THREE.MeshStandardMaterial({
            map: textureLoader.load('https://unpkg.com/three-globe/example/img/earth-clouds.png'),
            transparent: true,
            opacity: 0.35
        });
        const clouds = new THREE.Mesh(cloudGeo, cloudMat);
        scene.add(clouds);

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        // --- MEXICO PIN & PYRAMID ---
        const mexicoLat = 23.6345;
        const mexicoLng = -102.5528;
        const basePos = latLngToVector3(mexicoLat, mexicoLng, globeRadius);

        const mexicoGroup = new THREE.Group();

        const spotContainer = new THREE.Group();
        spotContainer.position.copy(basePos);
        spotContainer.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), basePos.clone().normalize());

        const stoneMat = new THREE.MeshStandardMaterial({ color: 0xF26522, roughness: 0.7 });
        const templeMat = new THREE.MeshStandardMaterial({ color: 0x009B9E, roughness: 0.6 });

        const pyramidGroup = new THREE.Group();
        const levels = 6;
        const baseSize = 0.6;
        const levelHeight = 0.06;

        for (let i = 0; i < levels; i++) {
            const size = baseSize * (1 - i * 0.13);
            const geo = new THREE.BoxGeometry(size, levelHeight, size);
            const mesh = new THREE.Mesh(geo, stoneMat);
            mesh.position.y = (i * levelHeight) + (levelHeight / 2);
            pyramidGroup.add(mesh);
        }

        const pyramidTopY = levels * levelHeight;
        const templeSize = baseSize * 0.28;
        const templeHeight = 0.12;
        const templeGeo = new THREE.BoxGeometry(templeSize, templeHeight, templeSize);
        const templeMesh = new THREE.Mesh(templeGeo, templeMat);
        templeMesh.position.y = pyramidTopY + (templeHeight / 2);
        pyramidGroup.add(templeMesh);

        const roofGeo = new THREE.BoxGeometry(templeSize * 1.1, 0.03, templeSize * 1.1);
        const roofMesh = new THREE.Mesh(roofGeo, stoneMat);
        roofMesh.position.y = pyramidTopY + templeHeight + 0.015;
        pyramidGroup.add(roofMesh);

        spotContainer.add(pyramidGroup);

        // --- FLAG ---
        const poleHeight = 0.5;
        const poleGeo = new THREE.CylinderGeometry(0.008, 0.008, poleHeight, 16);
        const poleMat = new THREE.MeshStandardMaterial({ color: 0xFFC800, metalness: 0.8 });
        const poleMesh = new THREE.Mesh(poleGeo, poleMat);
        
        const flagStartY = pyramidTopY + templeHeight + 0.03;
        poleMesh.position.set(0, flagStartY + (poleHeight / 2), 0);
        spotContainer.add(poleMesh);

        const flagCanvas = document.createElement('canvas');
        flagCanvas.width = 300;
        flagCanvas.height = 180;
        const ctx = flagCanvas.getContext('2d');

        ctx.fillStyle = "#009B9E"; ctx.fillRect(0, 0, 100, 180);
        ctx.fillStyle = "#FFFFFF"; ctx.fillRect(100, 0, 100, 180);
        ctx.fillStyle = "#E31B23"; ctx.fillRect(200, 0, 100, 180);
        ctx.fillStyle = "#FFC800";
        ctx.beginPath();
        ctx.arc(150, 90, 20, 0, Math.PI * 2);
        ctx.fill();

        const flagTexture = new THREE.CanvasTexture(flagCanvas);
        const flagWidth = 0.5;
        const flagHeight = 0.3;
        const flagGeo = new THREE.PlaneGeometry(flagWidth, flagHeight, 20, 10);
        const flagMat = new THREE.MeshStandardMaterial({ map: flagTexture, side: THREE.DoubleSide });
        const flagMesh = new THREE.Mesh(flagGeo, flagMat);
        flagMesh.position.set(flagWidth / 2, flagStartY + poleHeight - (flagHeight / 2), 0);
        spotContainer.add(flagMesh);

        mexicoGroup.add(spotContainer);
        scene.add(mexicoGroup);

        // --- STYLIZED 3D TOY AIRPLANE ---
        function createStylizedPlane() {
            const planeGroup = new THREE.Group();

            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.3 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.2 });
            const cyanMat = new THREE.MeshStandardMaterial({ color: 0x00d2ff, roughness: 0.2 });

            const bodyGeo = new THREE.SphereGeometry(0.35, 32, 16);
            bodyGeo.scale(2.2, 0.9, 0.9);
            const body = new THREE.Mesh(bodyGeo, whiteMat);
            planeGroup.add(body);

            const cockpitGeo = new THREE.SphereGeometry(0.2, 16, 16);
            cockpitGeo.scale(1.2, 0.6, 0.8);
            const cockpit = new THREE.Mesh(cockpitGeo, darkMat);
            cockpit.position.set(0.42, 0.08, 0);
            planeGroup.add(cockpit);

            for (let side = -1; side <= 1; side += 2) {
                if (side === 0) continue;
                for (let i = -3; i <= 1; i++) {
                    const windowGeo = new THREE.BoxGeometry(0.06, 0.08, 0.02);
                    const win = new THREE.Mesh(windowGeo, darkMat);
                    win.position.set(i * 0.12 - 0.05, 0.06, side * 0.31);
                    planeGroup.add(win);
                }
            }

            const wingGeo = new THREE.BoxGeometry(0.4, 0.05, 1.4);
            const wings = new THREE.Mesh(wingGeo, whiteMat);
            wings.position.set(-0.05, -0.05, 0);
            wings.rotation.y = -0.05;
            planeGroup.add(wings);

            const tailGeo = new THREE.BoxGeometry(0.35, 0.45, 0.06);
            const tail = new THREE.Mesh(tailGeo, whiteMat);
            tail.position.set(-0.65, 0.3, 0);
            tail.rotation.z = -0.4;
            planeGroup.add(tail);

            const tailWingGeo = new THREE.BoxGeometry(0.2, 0.04, 0.6);
            const tailWings = new THREE.Mesh(tailWingGeo, whiteMat);
            tailWings.position.set(-0.68, 0.05, 0);
            planeGroup.add(tailWings);

            const enginePositions = [-0.28, 0.28];
            enginePositions.forEach((zPos) => {
                const engineGroup = new THREE.Group();

                const engineGeo = new THREE.CylinderGeometry(0.09, 0.08, 0.28, 16);
                const engineMesh = new THREE.Mesh(engineGeo, whiteMat);
                engineMesh.rotation.z = Math.PI / 2;
                engineGroup.add(engineMesh);

                const ringGeo = new THREE.TorusGeometry(0.075, 0.025, 12, 24);
                const ringMesh = new THREE.Mesh(ringGeo, cyanMat);
                ringMesh.position.set(0.14, 0, 0);
                ringMesh.rotation.y = Math.PI / 2;
                engineGroup.add(ringMesh);

                engineGroup.position.set(0.02, -0.15, zPos);
                planeGroup.add(engineGroup);
            });

            planeGroup.scale.set(0.65, 0.65, 0.65);
            return planeGroup;
        }

        const airplanePivot = new THREE.Group();
        scene.add(airplanePivot);

        const toyAirplane = createStylizedPlane();
        const orbitRadius = globeRadius + 2.0;
        
        toyAirplane.position.set(orbitRadius, 1.0, 0);
        toyAirplane.rotation.set(0, -Math.PI / 2, -Math.PI / 10);
        
        airplanePivot.add(toyAirplane);

        // --- INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const clickables = [flagMesh, poleMesh, templeMesh, roofMesh, ...pyramidGroup.children];

        window.addEventListener('pointerdown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickables);

            if (intersects.length > 0) {
                window.location.href = "mapa.html";
            }
        });

        window.addEventListener('pointermove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickables);

            document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
        });

        const initialCameraPos = latLngToVector3(mexicoLat, mexicoLng, getCameraDistance());
        camera.position.copy(initialCameraPos);
        controls.update();

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            globe.rotation.y += 0.0005;
            clouds.rotation.y += 0.0008;
            mexicoGroup.rotation.y += 0.0005;
            starField.rotation.y -= 0.0001;

            airplanePivot.rotation.y += 0.008;
            airplanePivot.rotation.x = Math.sin(time * 0.4) * 0.12;

            const position = flagGeo.attributes.position;
            for (let i = 0; i < position.count; i++) {
                const u = position.getX(i);
                const wave = Math.sin(time * 5 + u * 6) * 0.025 * (u + flagWidth / 2);
                position.setZ(i, wave);
            }
            position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            
            // Recalculate camera position for responsiveness
            const dist = getCameraDistance();
            const direction = camera.position.clone().normalize();
            camera.position.copy(direction.multiplyScalar(dist));

            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
